# This file was created automatically with `jupyter-book init --gh-pages` 🪄 💚
# Ensure your GitHub Pages settings for this repository are set to deploy with **GitHub Actions**.

name: Jupyter Book (via myst) GitHub Pages Deploy
on:
  push:
    # Runs on pushes targeting the default branch or the redirect-test branch
    branches: [main, jez/redirect]
  pull_request:
    branches: [main]
env:
  # `BASE_URL` determines, relative to the root of the domain, the URL that your site is served from.
  # E.g., if your site lives at `https://mydomain.org/myproject`, set `BASE_URL=/myproject`.
  # If, instead, your site lives at the root of the domain, at `https://mydomain.org`, set `BASE_URL=''`.
  BASE_URL: /${{ github.event.repository.name }}
  # SiteURL sets the full canonical domain for sitemap generation
  SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: Run sync_notebooks to populate methods/
        run: python scripts/sync_notebooks.py --execute
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Install Jupyter Book (via myst)
        run: npm install -g jupyter-book
      - name: Build HTML Assets
        env:
          # Used by the github-issue-table MyST plugin to read the org Project board.
          # The built-in GITHUB_TOKEN cannot read org-level Projects, so this is a PAT
          # stored as a repository secret (needs read access to org projects + issues).
          GITHUB_TOKEN: ${{ secrets.PROJECT_READ_TOKEN }}
        run: jupyter-book build --html
      - name: Add legacy redirects
        run: python scripts/add_redirects.py ./_build/html
      - name: Verify legacy redirects
        run: |
          test -f ./_build/html/intro.html
          grep -q "/data-science-toolbox/" ./_build/html/intro.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'

      # --- Pull request previews on Netlify (GitHub Pages only serves main) ---
      - name: Check for Netlify secrets
        id: netlify
        if: github.event_name == 'pull_request'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          # Secrets are unavailable to PRs from forks, so skip quietly there.
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Netlify secrets not available; skipping preview."
          fi
      - name: Set up Node for Netlify CLI
        if: steps.netlify.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Deploy PR preview to Netlify
        if: steps.netlify.outputs.available == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          # The site is built to live under $BASE_URL (/data-science-toolbox), so keep
          # that path in the preview and redirect the root to it.
          mkdir -p preview
          cp -r ./_build/html "preview${BASE_URL}"
          echo "/  ${BASE_URL}/  302" > preview/_redirects
          npx --yes netlify-cli@27 deploy --dir preview \
            --alias "pr-${{ github.event.number }}" \
            --message "PR #${{ github.event.number }}" --json > netlify.json
          URL="$(jq -r '.deploy_url' netlify.json)${BASE_URL}/"
          echo "Preview: $URL"
          echo "### 🔍 Preview for PR #${{ github.event.number }}: $URL" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
